name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit high-severity dependencies
        run: yarn security:audit

      - name: Validate workspace dependencies
        run: yarn deps:validate

      - name: Validate turbo.json
        run: yarn gen:turbo:check

      - name: Build React
        run: yarn react:build

      - name: Lint
        run: yarn lint:ci

      - name: Test
        if: success()
        run: yarn test:ci

  framework-release-readiness:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build release packages
        run: yarn react:build

      - name: Pack and validate release packages
        run: yarn release:packages --prebuilt

      - name: Verify packed clean consumer
        run: yarn release:consumer

      - name: Verify release records
        run: yarn release:records
