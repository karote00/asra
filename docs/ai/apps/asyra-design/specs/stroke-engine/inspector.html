<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stroke Engine Inspector Flow</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1016;
        --surface: #151b24;
        --surface-raised: #1b2430;
        --line: #2a3544;
        --text: #edf3f8;
        --muted: #9aabba;
        --accent: #69d3ff;
        --accent-soft: rgba(105, 211, 255, 0.12);
        --good: #7be0b1;
        --warn: #f3c97a;
        --shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 1024px;
        background:
          radial-gradient(circle at 15% -10%, rgba(55, 122, 165, 0.2), transparent 32rem),
          var(--bg);
        color: var(--text);
        font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input { font: inherit; }

      .app {
        display: grid;
        grid-template-rows: auto auto 1fr;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 28px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 16, 22, 0.84);
        backdrop-filter: blur(14px);
        position: sticky;
        top: 0;
        z-index: 4;
      }

      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 21px; letter-spacing: -0.02em; }
      h2 { font-size: 17px; }
      h3 { font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }

      .eyebrow {
        margin-bottom: 3px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .stats { display: flex; gap: 8px; }
      .stat {
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: var(--surface);
      }
      .stat strong { color: var(--text); }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 28px;
        border-bottom: 1px solid var(--line);
      }

      .tabs { display: flex; gap: 6px; }
      .tab {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 7px 11px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        border-color: rgba(105, 211, 255, 0.28);
        color: var(--accent);
        background: var(--accent-soft);
      }

      .search {
        margin-left: auto;
        width: 260px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        color: var(--text);
        background: var(--surface);
      }
      .search:focus { border-color: var(--accent); }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        min-height: 0;
      }

      .content {
        padding: 24px 28px 44px;
        overflow: auto;
      }

      .detail {
        padding: 24px;
        border-left: 1px solid var(--line);
        background: rgba(21, 27, 36, 0.72);
        overflow: auto;
      }

      .lane {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 18px;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .lane:first-child { padding-top: 0; }
      .lane-title { color: var(--muted); font-weight: 650; }
      .lane-stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }

      .stage-card {
        appearance: none;
        min-height: 104px;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-align: left;
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
      }
      .stage-card:hover { border-color: #486177; transform: translateY(-1px); }
      .stage-card[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
      .stage-order { color: var(--accent); font-size: 11px; font-weight: 750; }
      .stage-title { margin-top: 4px; font-weight: 700; }
      .stage-owner { margin-top: 8px; color: var(--muted); font-size: 12px; }

      .detail-header { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
      .detail-purpose { margin-top: 8px; color: var(--muted); }
      .detail-section { margin-top: 20px; }
      .detail-section ul { margin: 8px 0 0; padding-left: 18px; }
      .detail-section li + li { margin-top: 5px; }
      code {
        color: var(--good);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .list { display: grid; gap: 10px; }
      .record {
        padding: 14px 15px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .record-title { display: flex; align-items: baseline; gap: 8px; font-weight: 700; }
      .badge {
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .record p { margin-top: 7px; color: var(--muted); }
      .record-meta { margin-top: 9px; color: var(--muted); font-size: 12px; }

      .empty { padding: 48px; text-align: center; color: var(--muted); }
      .error { margin: 32px; padding: 18px; border: 1px solid #7a3b45; border-radius: 10px; color: #ffb4bc; background: #28171b; }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>
    <script src="./inspector.data.js"></script>
    <script>
      ;(() => {
        const data = globalThis.STROKE_ENGINE_INSPECTOR_DATA
        const app = document.querySelector('#app')

        if (!data) {
          app.innerHTML = '<div class="error">Inspector data could not be loaded.</div>'
          return
        }

        let view = 'flow'
        let query = ''
        let selectedStageId = data.stages[0]?.id ?? null

        const escapeHtml = (value) =>
          String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')

        const list = (title, values) => `
          <section class="detail-section">
            <h3>${escapeHtml(title)}</h3>
            ${values.length ? `<ul>${values.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<p class="detail-purpose">None</p>'}
          </section>`

        const renderStageDetail = () => {
          const stage = data.stages.find((item) => item.id === selectedStageId)
          if (!stage) return '<div class="empty">Select a stage.</div>'
          return `
            <div class="detail-header">
              <div class="eyebrow">Stage ${stage.order} · ${escapeHtml(stage.ownerPackage)}</div>
              <h2>${escapeHtml(stage.title)}</h2>
              <p class="detail-purpose">${escapeHtml(stage.purpose)}</p>
            </div>
            ${list('Inputs', stage.inputs)}
            ${list('Outputs', stage.outputs)}
            ${list('Conditions', stage.conditions)}
            ${list('Bypasses', stage.bypasses)}
            ${list('Allowed contributors', stage.allowedContributors)}
            ${list('Forbidden contributors', stage.forbiddenContributors)}
            ${list('Cache dimensions', stage.cacheDimensions)}
            ${list('Implementation boundary', stage.implementationBoundary)}
            ${list('Spec references', stage.specRefs)}
            ${list('Failure owner', [stage.failureOwnerStageId])}`
        }

        const matches = (value) => JSON.stringify(value).toLowerCase().includes(query.toLowerCase())

        const renderFlow = () => data.lanes.map((lane) => {
          const stages = data.stages.filter((stage) => stage.laneId === lane.id && matches(stage))
          if (!stages.length && query) return ''
          return `
            <section class="lane">
              <div class="lane-title">${escapeHtml(lane.title)}</div>
              <div class="lane-stages">
                ${stages.map((stage) => `
                  <button class="stage-card" data-stage-id="${escapeHtml(stage.id)}" aria-pressed="${stage.id === selectedStageId}">
                    <div class="stage-order">${String(stage.order).padStart(2, '0')}</div>
                    <div class="stage-title">${escapeHtml(stage.title)}</div>
                    <div class="stage-owner">${escapeHtml(stage.ownerPackage)}</div>
                  </button>`).join('')}
              </div>
            </section>`
        }).join('') || '<div class="empty">No stages match this search.</div>'

        const renderRecords = (items, renderer) => {
          const filtered = items.filter(matches)
          return filtered.length ? `<div class="list">${filtered.map(renderer).join('')}</div>` : '<div class="empty">No records match this search.</div>'
        }

        const renderRoutes = () => renderRecords(data.routes, (route) => `
          <article class="record">
            <div class="record-title"><code>${escapeHtml(route.id)}</code><span class="badge">${escapeHtml(route.kind)}</span></div>
            <p>${escapeHtml(route.predicate)}</p>
            <div class="record-meta">${escapeHtml(route.from)} → ${escapeHtml(route.to ?? 'terminal')} · ${route.producedArtifacts.map(escapeHtml).join(', ')}</div>
          </article>`)

        const renderArtifacts = () => renderRecords(data.artifacts, (artifact) => `
          <article class="record">
            <div class="record-title"><code>${escapeHtml(artifact.id)}</code><span class="badge">${escapeHtml(artifact.channel)}</span></div>
            <p>Owner: ${escapeHtml(artifact.ownerStageId)}</p>
            <div class="record-meta">Consumers: ${artifact.consumerStageIds.length ? artifact.consumerStageIds.map(escapeHtml).join(', ') : 'terminal'}</div>
          </article>`)

        const renderInvariants = () => renderRecords(data.invariants, (invariant) => `
          <article class="record">
            <div class="record-title"><code>${escapeHtml(invariant.id)}</code></div>
            <p>${escapeHtml(invariant.statement)}</p>
            <div class="record-meta">Stages: ${invariant.stageIds.length} · Artifacts: ${invariant.artifactIds.length} · ${invariant.specRefs.map(escapeHtml).join(', ')}</div>
          </article>`)

        const renderAcceptance = () => renderRecords(data.acceptanceContracts, (contract) => `
          <article class="record">
            <div class="record-title">${escapeHtml(contract.title)}<span class="badge">${escapeHtml(contract.id)}</span></div>
            <p>${contract.assertions.map(escapeHtml).join(' · ')}</p>
            <div class="record-meta">Stages: ${contract.stageIds.map(escapeHtml).join(', ')} · ${contract.specRefs.map(escapeHtml).join(', ')}</div>
          </article>`)

        const contentForView = () => ({
          flow: renderFlow,
          routes: renderRoutes,
          artifacts: renderArtifacts,
          invariants: renderInvariants,
          acceptance: renderAcceptance
        })[view]()

        const render = () => {
          app.innerHTML = `
            <header>
              <div><div class="eyebrow">Schema ${data.schemaVersion}</div><h1>${escapeHtml(data.title)}</h1></div>
              <div class="stats">
                <span class="stat"><strong>${data.stages.length}</strong> stages</span>
                <span class="stat"><strong>${data.routes.length}</strong> routes</span>
                <span class="stat"><strong>${data.artifacts.length}</strong> artifacts</span>
                <span class="stat"><strong>${data.invariants.length}</strong> invariants</span>
              </div>
            </header>
            <div class="toolbar">
              <nav class="tabs" aria-label="Inspector views">
                ${[['flow','Flow'],['routes','Routes'],['artifacts','Artifacts'],['invariants','Invariants'],['acceptance','Acceptance']].map(([id, label]) => `<button class="tab" data-view="${id}" aria-selected="${view === id}">${label}</button>`).join('')}
              </nav>
              <input class="search" type="search" value="${escapeHtml(query)}" placeholder="Search ${escapeHtml(view)}…" aria-label="Search inspector records" />
            </div>
            <main>
              <section class="content">${contentForView()}</section>
              <aside class="detail">${renderStageDetail()}</aside>
            </main>`

          app.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => {
            view = button.dataset.view
            query = ''
            render()
          }))
          app.querySelectorAll('[data-stage-id]').forEach((button) => button.addEventListener('click', () => {
            selectedStageId = button.dataset.stageId
            render()
          }))
          const search = app.querySelector('.search')
          search.addEventListener('input', () => {
            query = search.value
            render()
            app.querySelector('.search').focus()
          })
        }

        render()
      })()
    </script>
  </body>
</html>
