name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit high-severity dependencies
        run: yarn security:audit

      - name: Validate workspace dependencies
        run: yarn deps:validate

      - name: Validate turbo.json
        run: yarn gen:turbo:check

      - name: Build React
        run: yarn react:build

      - name: Lint
        run: yarn lint:ci

      - name: Test
        if: success()
        run: yarn test:ci

  framework-release-readiness:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build release packages
        run: yarn react:build

      - name: Pack and validate release packages
        run: yarn release:packages --prebuilt

      - name: Verify packed clean consumer
        run: yarn release:consumer

      - name: Verify release records
        run: yarn release:records

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn
