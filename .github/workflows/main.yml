name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'yarn.lock'
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'package.json'
      - 'yarn.lock'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build turbo.json
        run: yarn gen:turbo

      - name: Build React
        run: yarn react:build

      - name: Lint
        run: yarn lint:ci

      - name: Test
        if: success()
        run: yarn test:ci

  e2e-trigger:
    if: github.event_name == 'pull_request' && success()
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Create E2E trigger status (non-blocking)
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              target_url: `${context.payload.repository.html_url}/actions/workflows/e2e-manual.yml`,
              description: 'Ready to run E2E tests manually',
              context: 'E2E Tests (Optional)'
            });

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'yarn'

      - name: Install dependencies
        run: yarn
